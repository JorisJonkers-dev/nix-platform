'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'

'permissions':
  'contents': 'read'

'jobs':
  'gitleaks':
    'name': 'Gitleaks'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          'fetch-depth': 0
      - 'name': 'Install gitleaks'
        'run': |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - 'name': 'Scan current tree and history'
        'run': '"$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact --exit-code 1'

  'nix':
    'name': 'Nix flake check'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'DeterminateSystems/nix-installer-action@v22'
      - 'run': 'nix flake check --print-build-logs'

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'if': '${{ always() }}'
    'needs':
      - 'gitleaks'
      - 'nix'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 're-actors/alls-green@release/v1'
        'with':
          'jobs': '${{ toJSON(needs) }}'
